apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jambo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: jambo-backend:local
          args: ["jambo-backend"]
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: jambo-config
            - secretRef:
                name: jambo-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jambo
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
