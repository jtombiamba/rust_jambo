# PodDisruptionBudgets so voluntary disruptions (drain, upgrades) never take
# down all replicas of a service at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: jambo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-worker
  namespace: jambo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scheduler-worker
  namespace: jambo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: scheduler-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
  namespace: jambo
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
