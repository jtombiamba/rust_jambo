apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: jambo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: jambo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: jambo-grafana:local
          ports:
            - containerPort: 3000
          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
            - name: GF_SERVER_ROOT_URL
              value: "/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_AUTH_BASIC_ENABLED
              value: "true"
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: "mailhog:1025"
            - name: GF_SMTP_FROM_ADDRESS
              value: "alerts@jambo.local"
            - name: GF_SMTP_FROM_NAME
              value: "Jambo Alerts"
            - name: EMAIL_ONCALL
              value: "oncall@jambo.local"
            - name: EMAIL_TEAM
              value: "team@jambo.local"
            - name: SLACK_CRITICAL_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: SLACK_CRITICAL_WEBHOOK_URL
                  optional: true
            - name: SLACK_CRITICAL_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: SLACK_CRITICAL_CHANNEL
                  optional: true
            - name: SLACK_WARNING_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: SLACK_WARNING_WEBHOOK_URL
                  optional: true
            - name: SLACK_WARNING_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: SLACK_WARNING_CHANNEL
                  optional: true
            - name: GF_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: SMTP_USERNAME
                  optional: true
            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: SMTP_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: jambo
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
