apiVersion: v1
kind: ConfigMap
metadata:
  name: jambo-config
  namespace: jambo
data:
  HOST: "0.0.0.0"
  PORT: "5000"
  LOG_LEVEL: "info"
  RUST_LOG: "info"
  FRONTEND_URL: "http://jambo.local"
  CORS_ALLOWED_ORIGINS: "http://jambo.local"
  DB_POOL_MAX_CONNECTIONS: "10"
  DB_POOL_MIN_CONNECTIONS: "1"
  DB_POOL_CONNECT_TIMEOUT_SECS: "8"
  DB_POOL_ACQUIRE_TIMEOUT_SECS: "8"
  DB_POOL_IDLE_TIMEOUT_SECS: "300"
  DB_POOL_MAX_LIFETIME_SECS: "1800"
  DB_POOL_METRICS_INTERVAL_SECS: "30"
  MAX_RABBITMQ_CONNECTION_RETRIES: "10"
  RABBITMQ_PUBLISH_MAX_RETRIES: "3"
  RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: "100"
  RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: "5000"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_COOLDOWN_SECS: "30"
  REDIS_PUBLISH_MAX_RETRIES: "5"
  REDIS_PUBLISH_RETRY_BASE_DELAY_MS: "100"
  REDIS_PUBLISH_RETRY_MAX_DELAY_MS: "2000"
  REDIS_EVENT_BUFFER_MAX_SIZE: "1000"
  REDIS_EVENT_BUFFER_FLUSH_INTERVAL_SECS: "1"
  WS_HEARTBEAT_INTERVAL_SECS: "30"
  WS_HEARTBEAT_TIMEOUT_SECS: "60"
  ROOM_MAX_PLAYERS: "8"
  RUN_STALENESS_TIMEOUT_SECS: "300"
  GAME_STALENESS_THRESHOLD_SECS: "60"
  GAME_HUMAN_STALENESS_ALERT_SECS: "120"
  GAME_HUMAN_STALENESS_KICK_SECS: "300"
  FREEZE_DURATION_SECS: "1800"
  DEFAULT_CREDIT: "500"
  UNFREEZE_CREDIT_NO_PAYMENT: "250"
  UNFREEZE_CREDIT_WITH_PAYMENT: "500"
  RATE_LIMIT_DEFAULT_MAX_REQUESTS: "120"
  RATE_LIMIT_DEFAULT_WINDOW_SECONDS: "3600"
  RATE_LIMIT_CONTACT_MAX_REQUESTS: "5"
  RATE_LIMIT_CONTACT_WINDOW_SECONDS: "60"
  RATE_LIMIT_REGISTER_MAX_REQUESTS: "3"
  RATE_LIMIT_REGISTER_WINDOW_SECONDS: "3600"
  RATE_LIMIT_LOGIN_MAX_REQUESTS: "10"
  RATE_LIMIT_LOGIN_WINDOW_SECONDS: "60"
  RATE_LIMIT_FORGOT_PASSWORD_MAX_REQUESTS: "3"
  RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS: "3600"
  RATE_LIMIT_RESET_PASSWORD_MAX_REQUESTS: "10"
  RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS: "60"
  MAILER_MODE: "smtp"
  SMTP_HOST: "mailhog"
  SMTP_PORT: "1025"
  SMTP_TLS: "false"
  SMTP_FROM_EMAIL: "noreply@jambo.local"
  SMTP_FROM_NAME: "Jambo Game"
  PAYPAL_MODE: "sandbox"
  PAYPAL_SANDBOX_URL: "https://api-m.sandbox.paypal.com"
  PAYPAL_LIVE_URL: "https://api-m.paypal.com"
  PAYPAL_UNFREEZE_AMOUNT_EUR: "1.00"
  PAYPAL_TOPUP_AMOUNT_EUR: "1.00"
  TOPUP_CREDIT_THRESHOLD: "50"
  TOPUP_CREDIT_AMOUNT: "500"
  BENCHMARK_MODE: "false"
  BENCHMARK_SKIP_CREDIT_CHECK: "false"
  BOT_THINKING_DELAY_MS: "800"
  AI_WORKER_MAX_CONCURRENT: "50"
  AI_WORKER_DB_POOL_SIZE: "50"
  SCHEDULER_TASK_MAX_RESTARTS: "3"
  RUN_COMPLETION_MAX_RETRIES: "3"
  BOT_CHAIN_MAX_RETRIES: "3"
  BOT_CHAIN_RETRY_BASE_DELAY_MS: "200"
