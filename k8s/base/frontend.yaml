apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jambo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: jambo-frontend:local
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: "http://api.jambo.local"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: jambo
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
