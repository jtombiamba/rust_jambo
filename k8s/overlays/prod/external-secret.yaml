# External Secrets Operator → HCP Vault.
#
# ESO is installed by the Terraform `platform` module. The SecretStore below
# authenticates to HCP Vault using Kubernetes auth (SA JWT); the same mechanism
# works on DOKS and EKS, so this manifest is cloud-agnostic.
#
# The `server` URL is a placeholder — override it per environment with a
# kustomize `patches` entry in k8s/overlays/{staging,prod} (or a `replacements`
# targeting spec.provider.vault.server). Example HCP Vault public address:
#   https://<cluster>.vault.<hash>.aws.hashicorp.cloud:8200
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: hcp-vault
  namespace: jambo
spec:
  provider:
    vault:
      server: "https://vault.example.com:8200"
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "jambo"
          serviceAccountRef:
            name: "external-secrets"
---
# Backend / workers / db-backup (envFrom -> secretRef: jambo-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jambo-secrets
  namespace: jambo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: hcp-vault
    kind: SecretStore
  target:
    name: jambo-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: jambo
        property: JWT_SECRET
    - secretKey: JWT_EXPIRY_HOURS
      remoteRef:
        key: jambo
        property: JWT_EXPIRY_HOURS
    - secretKey: IP_HASH_PEPPER
      remoteRef:
        key: jambo
        property: IP_HASH_PEPPER
    - secretKey: PAYPAL_CLIENT_ID
      remoteRef:
        key: jambo
        property: PAYPAL_CLIENT_ID
    - secretKey: PAYPAL_CLIENT_SECRET
      remoteRef:
        key: jambo
        property: PAYPAL_CLIENT_SECRET
    - secretKey: BENCHMARK_API_TOKEN
      remoteRef:
        key: jambo
        property: BENCHMARK_API_TOKEN
    - secretKey: DATABASE_URL
      remoteRef:
        key: jambo
        property: DATABASE_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: jambo
        property: RABBITMQ_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: jambo
        property: REDIS_URL
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: jambo
        property: S3_ENDPOINT
    - secretKey: S3_BUCKET
      remoteRef:
        key: jambo
        property: S3_BUCKET
    - secretKey: S3_PREFIX
      remoteRef:
        key: jambo
        property: S3_PREFIX
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: jambo
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: jambo
        property: S3_SECRET_KEY
    - secretKey: S3_REGION
      remoteRef:
        key: jambo
        property: S3_REGION
    - secretKey: S3_INSECURE
      remoteRef:
        key: jambo
        property: S3_INSECURE
    - secretKey: BACKUP_RETENTION_DAYS
      remoteRef:
        key: jambo
        property: BACKUP_RETENTION_DAYS
---
# Monitoring nginx basic-auth (secretKeyRef: monitoring-nginx-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: monitoring-nginx-secrets
  namespace: jambo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: hcp-vault
    kind: SecretStore
  target:
    name: monitoring-nginx-secrets
    creationPolicy: Owner
  data:
    - secretKey: PROMETHEUS_USER
      remoteRef:
        key: jambo
        property: PROMETHEUS_USER
    - secretKey: PROMETHEUS_PASSWORD
      remoteRef:
        key: jambo
        property: PROMETHEUS_PASSWORD
    - secretKey: GRAFANA_USER
      remoteRef:
        key: jambo
        property: GRAFANA_USER
    - secretKey: GRAFANA_PASSWORD
      remoteRef:
        key: jambo
        property: GRAFANA_PASSWORD
---
# Alertmanager (secretKeyRef: alertmanager-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: jambo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: hcp-vault
    kind: SecretStore
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
  data:
    - secretKey: SLACK_CRITICAL_WEBHOOK_URL
      remoteRef:
        key: jambo
        property: SLACK_CRITICAL_WEBHOOK_URL
    - secretKey: SLACK_WARNING_WEBHOOK_URL
      remoteRef:
        key: jambo
        property: SLACK_WARNING_WEBHOOK_URL
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: jambo
        property: SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: jambo
        property: SMTP_PASSWORD
