apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: jambo-backend
    newName: ghcr.io/jtombiamba/rust_jambo-backend
    newTag: latest
  - name: jambo-frontend
    newName: ghcr.io/jtombiamba/rust_jambo-frontend
    newTag: latest
  - name: jambo-loki
    newName: ghcr.io/jtombiamba/rust_jambo-loki
    newTag: latest
  - name: jambo-promtail
    newName: ghcr.io/jtombiamba/rust_jambo-promtail
    newTag: latest
  - name: jambo-tempo
    newName: ghcr.io/jtombiamba/rust_jambo-tempo
    newTag: latest
  - name: jambo-grafana
    newName: ghcr.io/jtombiamba/rust_jambo-grafana
    newTag: latest
  - name: jambo-alertmanager
    newName: ghcr.io/jtombiamba/rust_jambo-alertmanager
    newTag: latest
  - name: jambo-prometheus
    newName: ghcr.io/jtombiamba/rust_jambo-prometheus
    newTag: latest
  - name: jambo-monitoring-nginx
    newName: ghcr.io/jtombiamba/rust_jambo-monitoring-nginx
    newTag: latest
patches:
  # Add the GHCR pull secret to every Deployment (backend, frontend,
  # ai-worker, scheduler-worker, loki, tempo, grafana, alertmanager,
  # prometheus, monitoring-nginx). `target` without a name matches all
  # resources of that kind.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-pull
  - target:
      kind: DaemonSet
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: unused
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-pull
