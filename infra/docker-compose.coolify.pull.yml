version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jambo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jambo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  backend:
    image: ghcr.io/jtombiamba/rust_jambo-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jambo}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      MAX_RABBITMQ_CONNECTION_RETRIES: ${MAX_RABBITMQ_CONNECTION_RETRIES:-10}
      RABBITMQ_PUBLISH_MAX_RETRIES: ${RABBITMQ_PUBLISH_MAX_RETRIES:-3}
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS:-100}
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS:-5000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_COOLDOWN_SECS: ${CIRCUIT_BREAKER_COOLDOWN_SECS:-30}
      GAME_STALENESS_THRESHOLD_SECS: ${GAME_STALENESS_THRESHOLD_SECS:-60}
      DB_POOL_MAX_CONNECTIONS: ${DB_POOL_MAX_CONNECTIONS:-100}
      DB_POOL_MIN_CONNECTIONS: ${DB_POOL_MIN_CONNECTIONS:-5}
      DB_POOL_CONNECT_TIMEOUT_SECS: ${DB_POOL_CONNECT_TIMEOUT_SECS:-8}
      DB_POOL_ACQUIRE_TIMEOUT_SECS: ${DB_POOL_ACQUIRE_TIMEOUT_SECS:-8}
      DB_POOL_IDLE_TIMEOUT_SECS: ${DB_POOL_IDLE_TIMEOUT_SECS:-300}
      DB_POOL_MAX_LIFETIME_SECS: ${DB_POOL_MAX_LIFETIME_SECS:-1800}
      DB_POOL_METRICS_INTERVAL_SECS: ${DB_POOL_METRICS_INTERVAL_SECS:-30}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me-in-production-please-do-it-now}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-ip-pepper-change-me-1234567890abcdef}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_DEFAULT_MAX_REQUESTS: ${RATE_LIMIT_DEFAULT_MAX_REQUESTS:-120}
      RATE_LIMIT_DEFAULT_WINDOW_SECONDS: ${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:-3600}
      RATE_LIMIT_CONTACT_MAX_REQUESTS: ${RATE_LIMIT_CONTACT_MAX_REQUESTS:-5}
      RATE_LIMIT_CONTACT_WINDOW_SECONDS: ${RATE_LIMIT_CONTACT_WINDOW_SECONDS:-60}
      RATE_LIMIT_REGISTER_MAX_REQUESTS: ${RATE_LIMIT_REGISTER_MAX_REQUESTS:-3}
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
      RATE_LIMIT_LOGIN_MAX_REQUESTS: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:-10}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      RATE_LIMIT_FORGOT_PASSWORD_MAX_REQUESTS: ${RATE_LIMIT_FORGOT_PASSWORD_MAX_REQUESTS:-3}
      RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS: ${RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:-3600}
      RATE_LIMIT_RESET_PASSWORD_MAX_REQUESTS: ${RATE_LIMIT_RESET_PASSWORD_MAX_REQUESTS:-10}
      RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS: ${RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:-60}
      MAILER_MODE: ${MAILER_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-FapFap Game}
      FREEZE_DURATION_SECS: ${FREEZE_DURATION_SECS:-86400}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_UNFREEZE_AMOUNT_EUR: ${PAYPAL_UNFREEZE_AMOUNT_EUR:-1.00}
      PAYPAL_TOPUP_AMOUNT_EUR: ${PAYPAL_TOPUP_AMOUNT_EUR:-1.00}
      PAYPAL_SANDBOX_URL: ${PAYPAL_SANDBOX_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_LIVE_URL: ${PAYPAL_LIVE_URL:-https://api-m.paypal.com}
      TOPUP_CREDIT_THRESHOLD: ${TOPUP_CREDIT_THRESHOLD:-50}
      TOPUP_CREDIT_AMOUNT: ${TOPUP_CREDIT_AMOUNT:-500}
    networks:
      - internal
      - monitoring
    expose:
      - "8080"
    labels:
      - "coolify.service.name=jambo-backend"
      - "coolify.service.port=8080"
      - "traefik.enable=true"
      - "traefik.http.routers.backend-api.rule=Host(`jambo.backend.tombislab.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-ws.rule=Host(`jambo.backend.tombislab.com`) && PathPrefix(`/ws`)"
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolalloworiginlist=https://jambo.tombislab.com"

  frontend:
    image: ghcr.io/jtombiamba/rust_jambo-frontend:latest
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8080}
    networks:
      - internal
    expose:
      - "80"
    labels:
      - "coolify.service.name=jambo-frontend"
      - "coolify.service.port=80"

  ai-worker:
    image: ghcr.io/jtombiamba/rust_jambo-backend:latest
    command: ["ai-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jambo}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      MAX_RABBITMQ_CONNECTION_RETRIES: ${MAX_RABBITMQ_CONNECTION_RETRIES:-10}
      RABBITMQ_PUBLISH_MAX_RETRIES: ${RABBITMQ_PUBLISH_MAX_RETRIES:-3}
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS:-100}
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS:-5000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_COOLDOWN_SECS: ${CIRCUIT_BREAKER_COOLDOWN_SECS:-30}
      GAME_STALENESS_THRESHOLD_SECS: ${GAME_STALENESS_THRESHOLD_SECS:-60}
      DB_POOL_MAX_CONNECTIONS: ${DB_POOL_MAX_CONNECTIONS:-5}
      DB_POOL_MIN_CONNECTIONS: ${DB_POOL_MIN_CONNECTIONS:-1}
      DB_POOL_CONNECT_TIMEOUT_SECS: ${DB_POOL_CONNECT_TIMEOUT_SECS:-8}
      DB_POOL_ACQUIRE_TIMEOUT_SECS: ${DB_POOL_ACQUIRE_TIMEOUT_SECS:-8}
      DB_POOL_IDLE_TIMEOUT_SECS: ${DB_POOL_IDLE_TIMEOUT_SECS:-300}
      DB_POOL_MAX_LIFETIME_SECS: ${DB_POOL_MAX_LIFETIME_SECS:-1800}
      DB_POOL_METRICS_INTERVAL_SECS: ${DB_POOL_METRICS_INTERVAL_SECS:-30}
      BOT_THINKING_DELAY_MS: ${BOT_THINKING_DELAY_MS:-800}
      AI_WORKER_MAX_CONCURRENT: ${AI_WORKER_MAX_CONCURRENT:-50}
      AI_WORKER_DB_POOL_SIZE: ${AI_WORKER_DB_POOL_SIZE:-50}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me-in-production-please-do-it-now}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-ip-pepper-change-me-1234567890abcdef}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MAILER_MODE: ${MAILER_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-FapFap Game}
    networks:
      - internal
    expose:
      - "10080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ai-worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "coolify.service.name=jambo-ai-worker"
      - "coolify.service.port=0"

  scheduler-worker:
    image: ghcr.io/jtombiamba/rust_jambo-backend:latest
    command: ["scheduler-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jambo}
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      GAME_STALENESS_THRESHOLD_SECS: ${GAME_STALENESS_THRESHOLD_SECS:-60}
      GAME_HUMAN_STALENESS_ALERT_SECS: ${GAME_HUMAN_STALENESS_ALERT_SECS:-120}
      GAME_HUMAN_STALENESS_KICK_SECS: ${GAME_HUMAN_STALENESS_KICK_SECS:-300}
      DB_POOL_MAX_CONNECTIONS: ${DB_POOL_MAX_CONNECTIONS:-5}
      DB_POOL_MIN_CONNECTIONS: ${DB_POOL_MIN_CONNECTIONS:-1}
      DB_POOL_CONNECT_TIMEOUT_SECS: ${DB_POOL_CONNECT_TIMEOUT_SECS:-8}
      DB_POOL_ACQUIRE_TIMEOUT_SECS: ${DB_POOL_ACQUIRE_TIMEOUT_SECS:-8}
      DB_POOL_IDLE_TIMEOUT_SECS: ${DB_POOL_IDLE_TIMEOUT_SECS:-300}
      DB_POOL_MAX_LIFETIME_SECS: ${DB_POOL_MAX_LIFETIME_SECS:-1800}
      DB_POOL_METRICS_INTERVAL_SECS: ${DB_POOL_METRICS_INTERVAL_SECS:-30}
      RUN_STALENESS_TIMEOUT_SECS: ${RUN_STALENESS_TIMEOUT_SECS:-300}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAILER_MODE: ${MAILER_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-FapFap Game}
      FREEZE_DURATION_SECS: ${FREEZE_DURATION_SECS:-86400}
      UNFREEZE_CREDIT_NO_PAYMENT: ${UNFREEZE_CREDIT_NO_PAYMENT:-250}
      DEFAULT_CREDIT: ${DEFAULT_CREDIT:-500}
    networks:
      - internal
    expose:
      - "9080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "coolify.service.name=jambo-scheduler-worker"
      - "coolify.service.port=0"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ${PWD}/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.route-prefix=/prometheus"
      - "--web.external-url=/prometheus"
    networks:
      - monitoring
    # expose:
    #   - "9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`jambo.monitoring.tombislab.com`) && PathPrefix(`/prometheus`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_BASE: /dozzle
      DOZZLE_ENABLE_ACTIONS: "false"
    command: --base /dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    # expose:
    #   - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`jambo.monitoring.tombislab.com`) && PathPrefix(`/dozzle`)"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  # monitoring-nginx:
  #   image: ghcr.io/jtombiamba/rust_jambo-monitoring-nginx:latest
  #   profiles: ["monitoring"]
  #   environment:
  #     PROMETHEUS_USER: ${PROMETHEUS_USER:-admin}
  #     PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD:?PROMETHEUS_PASSWORD must be set}
  #     DOZZLE_USER: ${DOZZLE_USER:-admin}
  #     DOZZLE_PASSWORD: ${DOZZLE_PASSWORD:?DOZZLE_PASSWORD must be set}
  #   networks:
  #     - internal
  #   labels:
  #     - "coolify.service.name=jambo-monitoring"
  #     - "coolify.service.port=8888"
  #   expose:
  #     - "8888"
  #   depends_on:
  #     - prometheus
  #     - dozzle

volumes:
  postgres_data:
  prometheus_data:

networks:
  internal:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
