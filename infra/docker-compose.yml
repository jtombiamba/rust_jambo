version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jambo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 5000
      LOG_LEVEL: info
      RUST_LOG: info
      MAX_RABBITMQ_CONNECTION_RETRIES: 10
      RABBITMQ_PUBLISH_MAX_RETRIES: 3
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: 100
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: 5000
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_COOLDOWN_SECS: 30
      GAME_STALENESS_THRESHOLD_SECS: 60
      DB_POOL_MAX_CONNECTIONS: 200
      DB_POOL_MIN_CONNECTIONS: 10
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 30
      JWT_SECRET: super-secret-key-change-me-in-production-please-do-it-now
      JWT_EXPIRY_HOURS: 24
      IP_HASH_PEPPER: ip-pepper-change-me-1234567890abcdef
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      RATE_LIMIT_DEFAULT_MAX_REQUESTS: "120"
      RATE_LIMIT_DEFAULT_WINDOW_SECONDS: "3600"
      RATE_LIMIT_CONTACT_MAX_REQUESTS: "5"
      RATE_LIMIT_CONTACT_WINDOW_SECONDS: "60"
      RATE_LIMIT_REGISTER_MAX_REQUESTS: "3"
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: "3600"
      RATE_LIMIT_LOGIN_MAX_REQUESTS: "10"
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: "60"
      RATE_LIMIT_FORGOT_PASSWORD_MAX_REQUESTS: "3"
      RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS: "3600"
      RATE_LIMIT_RESET_PASSWORD_MAX_REQUESTS: "10"
      RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS: "60"
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
      FREEZE_DURATION_SECS: 1800  # 86400
      # PayPal credentials come from the gitignored .env file (see .env.example).
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_MODE: sandbox
      PAYPAL_UNFREEZE_AMOUNT_EUR: "1.00"
      PAYPAL_TOPUP_AMOUNT_EUR: "1.00"
      PAYPAL_SANDBOX_URL: https://api-m.sandbox.paypal.com
      PAYPAL_LIVE_URL: https://api-m.paypal.com
      TOPUP_CREDIT_THRESHOLD: "50"
      TOPUP_CREDIT_AMOUNT: "500"
    ports:
      - "5000:5000"
    volumes:
      - ../backend/migration:/app/migration:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - DEV=true

  ai-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["ai-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 5000
      LOG_LEVEL: info
      RUST_LOG: info
      MAX_RABBITMQ_CONNECTION_RETRIES: 10
      RABBITMQ_PUBLISH_MAX_RETRIES: 3
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: 100
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: 5000
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_COOLDOWN_SECS: 30
      GAME_STALENESS_THRESHOLD_SECS: 60
      DB_POOL_MAX_CONNECTIONS: 5
      DB_POOL_MIN_CONNECTIONS: 1
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 30
      BOT_THINKING_DELAY_MS: 800
      AI_WORKER_MAX_CONCURRENT: 50
      AI_WORKER_DB_POOL_SIZE: 50
      JWT_SECRET: super-secret-key-change-me-in-production-please-do-it-now
      JWT_EXPIRY_HOURS: 24
      IP_HASH_PEPPER: ip-pepper-change-me-1234567890abcdef
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
    expose:
      - "7000"
    restart: unless-stopped
    volumes:
      - ../backend/migration:/app/migration:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ai-worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  scheduler-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["scheduler-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      GAME_STALENESS_THRESHOLD_SECS: 60
      GAME_HUMAN_STALENESS_ALERT_SECS: 120
      GAME_HUMAN_STALENESS_KICK_SECS: 300
      DB_POOL_MAX_CONNECTIONS: 5
      DB_POOL_MIN_CONNECTIONS: 1
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 30
      RUN_STALENESS_TIMEOUT_SECS: 300
      FRONTEND_URL: http://localhost:3000
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
      FREEZE_DURATION_SECS: 1800
      UNFREEZE_CREDIT_NO_PAYMENT: 250
      DEFAULT_CREDIT: 500
    expose:
      - "6000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_BASE: /dozzle
      DOZZLE_ENABLE_ACTIONS: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "8080"

  # ── LGTM Stack ──────────────────────────────────────────────

  loki:
    build:
      context: ./loki
      dockerfile: Dockerfile
    container_name: jambo-loki
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    expose:
      - "3100"
    restart: unless-stopped

  promtail:
    build:
      context: ./promtail
      dockerfile: Dockerfile
    container_name: jambo-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped
    depends_on:
      - loki

  tempo:
    build:
      context: ./tempo
      dockerfile: Dockerfile
    container_name: jambo-tempo
    volumes:
      - tempo_data:/tmp/tempo
      - tempo_generator_data:/var/tempo/generator
    command: -config.file=/etc/tempo/tempo-config.yml
    expose:
      - "3200"
      - "4317"
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: jambo-grafana
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/etc/grafana/provisioning/
    environment:
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_ROOT_URL: /grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: true
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

  alertmanager:
    build:
      context: ./alertmanager
      dockerfile: Dockerfile
    container_name: jambo-alertmanager
    expose:
      - "9093"
    volumes:
      - alertmanager_data:/alertmanager
    environment:
      SLACK_CRITICAL_WEBHOOK_URL: ${SLACK_CRITICAL_WEBHOOK_URL}
      SLACK_WARNING_WEBHOOK_URL: ${SLACK_WARNING_WEBHOOK_URL}
      SLACK_CRITICAL_CHANNEL: ${SLACK_CRITICAL_CHANNEL:-#alerts-critical}
      SLACK_WARNING_CHANNEL: ${SLACK_WARNING_CHANNEL:-#alerts-warning}
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-mailhog:1025}
      SMTP_FROM: ${SMTP_FROM:-alerts@jambo.local}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      EMAIL_ONCALL: ${EMAIL_ONCALL:-oncall@jambo.local}
      EMAIL_TEAM: ${EMAIL_TEAM:-team@jambo.local}
      RESOLVE_TIMEOUT: ${RESOLVE_TIMEOUT:-5m}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://localhost:9093}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    expose:
      - "9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.route-prefix=/prometheus"
      - "--web.external-url=/prometheus"
      - "--web.enable-remote-write-receiver"
    depends_on:
      - alertmanager

  monitoring-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      PROMETHEUS_USER: ${PROMETHEUS_USER:-admin}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD:-changeme}
      DOZZLE_USER: ${DOZZLE_USER:-admin}
      DOZZLE_PASSWORD: ${DOZZLE_PASSWORD:-changeme}
      GRAFANA_USER: ${GRAFANA_USER:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
    depends_on:
      - prometheus
      - dozzle
      - grafana

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  tempo_generator_data:
  grafana_data:
  alertmanager_data:
