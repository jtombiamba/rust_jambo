version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jambo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      RUST_LOG: info
      MAX_RABBITMQ_CONNECTION_RETRIES: 10
      RABBITMQ_PUBLISH_MAX_RETRIES: 3
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: 100
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: 5000
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_COOLDOWN_SECS: 30
      GAME_STALENESS_THRESHOLD_SECS: 60
      DB_POOL_MAX_CONNECTIONS: 200
      DB_POOL_MIN_CONNECTIONS: 10
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 30
      JWT_SECRET: super-secret-key-change-me-in-production-please-do-it-now
      JWT_EXPIRY_HOURS: 24
      IP_HASH_PEPPER: ip-pepper-change-me-1234567890abcdef
      FRONTEND_URL: http://localhost:3000
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
      FREEZE_DURATION_SECS: 3600
      PAYPAL_CLIENT_ID: "AQ2JP_GOYN9CvyrMMZBDdgmcekmOCU5nN_AsBZ9DcPmV7p6fpS38XDQ5nltjy6QAo8e2AFRDIS-EfZOS"
      PAYPAL_CLIENT_SECRET: "EH3PT62FDJ0RIWIHU6CIUNdJFtmm8If9QYyxICy7yYyY9ccT7TGi8W97H2tradvjPfAU3Oh8DTXTIw00"
      PAYPAL_MODE: sandbox
      PAYPAL_UNFREEZE_AMOUNT_EUR: "1.00"
      PAYPAL_SANDBOX_URL: https://api-m.sandbox.paypal.com
      PAYPAL_LIVE_URL: https://api-m.paypal.com
    ports:
      - "8080:8080"
    volumes:
      - ../backend/migration:/app/migration:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080

  ai-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["ai-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      RUST_LOG: info
      MAX_RABBITMQ_CONNECTION_RETRIES: 10
      RABBITMQ_PUBLISH_MAX_RETRIES: 3
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: 100
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: 5000
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_COOLDOWN_SECS: 30
      GAME_STALENESS_THRESHOLD_SECS: 60
      DB_POOL_MAX_CONNECTIONS: 5
      DB_POOL_MIN_CONNECTIONS: 1
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 30
      BOT_THINKING_DELAY_MS: 800
      AI_WORKER_MAX_CONCURRENT: 50
      AI_WORKER_DB_POOL_SIZE: 50
      JWT_SECRET: super-secret-key-change-me-in-production-please-do-it-now
      JWT_EXPIRY_HOURS: 24
      IP_HASH_PEPPER: ip-pepper-change-me-1234567890abcdef
      FRONTEND_URL: http://localhost:3000
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
    volumes:
      - ../backend/migration:/app/migration:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ai-worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

volumes:
  postgres_data:
  prometheus_data:
