apiVersion: 1

groups:
  - orgId: 1
    name: infrastructure
    folder: Jambo Alerts
    interval: 30s
    rules:
      - uid: infra-node-down
        title: NodeDown
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'up{job="kubernetes-nodes"} == 0'
              instant: true
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: Node {{ $labels.node }} is down
          description: The kubelet on node {{ $labels.node }} has been unreachable for 5 minutes.

      - uid: infra-node-high-cpu
        title: NodeHighCPU
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85'
              instant: true
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: Node {{ $labels.instance }} CPU > 85%
          description: Node {{ $labels.instance }} CPU usage above 85% for 10 minutes.

      - uid: infra-node-disk-almost-full
        title: NodeDiskAlmostFull
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '(1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 90'
              instant: true
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: Node {{ $labels.instance }} filesystem nearly full
          description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is over 90% full.

      - uid: infra-pod-crash-looping
        title: PodCrashLooping
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'rate(kube_pod_container_status_restarts_total[15m]) > 0'
              instant: true
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: Pod {{ $labels.pod }} is crash-looping
          description: Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) has restarted in the last 15 minutes.

      - uid: infra-deployment-replicas-mismatch
        title: DeploymentReplicasMismatch
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'kube_deployment_spec_replicas != kube_deployment_status_replicas_available'
              instant: true
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: Deployment {{ $labels.deployment }} has a replica mismatch
          description: Deployment {{ $labels.deployment }} (namespace {{ $labels.namespace }}) has {{ $labels.kube_deployment_spec_replicas }} desired replicas but only {{ $labels.kube_deployment_status_replicas_available }} available.

      - uid: infra-pvc-almost-full
        title: PVCAlmostFull
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.9'
              instant: true
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: PVC {{ $labels.persistentvolumeclaim }} is over 90% full
          description: PVC {{ $labels.persistentvolumeclaim }} (namespace {{ $labels.namespace }}) is over 90% full.
