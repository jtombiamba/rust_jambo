apiVersion: 1

groups:
  - orgId: 1
    name: jambo-scheduler
    folder: Jambo Alerts
    interval: 30s
    rules:
      - uid: scheduler-worker-high-cpu
        title: SchedulerWorkerHighCPU
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'cpu_usage_percent{process="scheduler_worker"} > 80'
              instant: true
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Scheduler Worker CPU > 80%
          description: Scheduler Worker process CPU above 80%. Investigate background task performance.
