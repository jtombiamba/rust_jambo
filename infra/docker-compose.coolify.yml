version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jambo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jambo"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No external ports, internal network only
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jambo}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      MAX_RABBITMQ_CONNECTION_RETRIES: ${MAX_RABBITMQ_CONNECTION_RETRIES:-10}
      RABBITMQ_PUBLISH_MAX_RETRIES: ${RABBITMQ_PUBLISH_MAX_RETRIES:-3}
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS:-100}
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS:-5000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_COOLDOWN_SECS: ${CIRCUIT_BREAKER_COOLDOWN_SECS:-30}
      GAME_STALENESS_THRESHOLD_SECS: ${GAME_STALENESS_THRESHOLD_SECS:-60}
      DB_POOL_MAX_CONNECTIONS: ${DB_POOL_MAX_CONNECTIONS:-100}
      DB_POOL_MIN_CONNECTIONS: ${DB_POOL_MIN_CONNECTIONS:-5}
      DB_POOL_CONNECT_TIMEOUT_SECS: ${DB_POOL_CONNECT_TIMEOUT_SECS:-8}
      DB_POOL_ACQUIRE_TIMEOUT_SECS: ${DB_POOL_ACQUIRE_TIMEOUT_SECS:-8}
      DB_POOL_IDLE_TIMEOUT_SECS: ${DB_POOL_IDLE_TIMEOUT_SECS:-300}
      DB_POOL_MAX_LIFETIME_SECS: ${DB_POOL_MAX_LIFETIME_SECS:-1800}
      DB_POOL_METRICS_INTERVAL_SECS: ${DB_POOL_METRICS_INTERVAL_SECS:-30}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me-in-production-please-do-it-now}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-ip-pepper-change-me-1234567890abcdef}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MAILER_MODE: ${MAILER_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-FapFap Game}
      FREEZE_DURATION_SECS: ${FREEZE_DURATION_SECS:-86400}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_UNFREEZE_AMOUNT_EUR: ${PAYPAL_UNFREEZE_AMOUNT_EUR:-1.00}
      PAYPAL_TOPUP_AMOUNT_EUR: ${PAYPAL_TOPUP_AMOUNT_EUR:-1.00}
      PAYPAL_SANDBOX_URL: ${PAYPAL_SANDBOX_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_LIVE_URL: ${PAYPAL_LIVE_URL:-https://api-m.paypal.com}
      TOPUP_CREDIT_THRESHOLD: ${TOPUP_CREDIT_THRESHOLD:-50}
      TOPUP_CREDIT_AMOUNT: ${TOPUP_CREDIT_AMOUNT:-500}
    networks:
      - internal
    expose:
      - "8080"
    # Optional: labels for Coolify
    labels:
      - "coolify.service.name=jambo-backend"
      - "coolify.service.port=8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8080}
    networks:
      - internal
    expose:
      - "80"
    labels:
      - "coolify.service.name=jambo-frontend"
      - "coolify.service.port=80"

  ai-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["ai-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jambo}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      MAX_RABBITMQ_CONNECTION_RETRIES: ${MAX_RABBITMQ_CONNECTION_RETRIES:-10}
      RABBITMQ_PUBLISH_MAX_RETRIES: ${RABBITMQ_PUBLISH_MAX_RETRIES:-3}
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS:-100}
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: ${RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS:-5000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_COOLDOWN_SECS: ${CIRCUIT_BREAKER_COOLDOWN_SECS:-30}
      GAME_STALENESS_THRESHOLD_SECS: ${GAME_STALENESS_THRESHOLD_SECS:-60}
      DB_POOL_MAX_CONNECTIONS: ${DB_POOL_MAX_CONNECTIONS:-5}
      DB_POOL_MIN_CONNECTIONS: ${DB_POOL_MIN_CONNECTIONS:-1}
      DB_POOL_CONNECT_TIMEOUT_SECS: ${DB_POOL_CONNECT_TIMEOUT_SECS:-8}
      DB_POOL_ACQUIRE_TIMEOUT_SECS: ${DB_POOL_ACQUIRE_TIMEOUT_SECS:-8}
      DB_POOL_IDLE_TIMEOUT_SECS: ${DB_POOL_IDLE_TIMEOUT_SECS:-300}
      DB_POOL_MAX_LIFETIME_SECS: ${DB_POOL_MAX_LIFETIME_SECS:-1800}
      DB_POOL_METRICS_INTERVAL_SECS: ${DB_POOL_METRICS_INTERVAL_SECS:-30}
      BOT_THINKING_DELAY_MS: ${BOT_THINKING_DELAY_MS:-800}
      AI_WORKER_MAX_CONCURRENT: ${AI_WORKER_MAX_CONCURRENT:-50}
      AI_WORKER_DB_POOL_SIZE: ${AI_WORKER_DB_POOL_SIZE:-50}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me-in-production-please-do-it-now}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-ip-pepper-change-me-1234567890abcdef}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MAILER_MODE: ${MAILER_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-FapFap Game}
    networks:
      - internal
    volumes:
      - ../backend/migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ai-worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "coolify.service.name=jambo-ai-worker"
      - "coolify.service.port=0"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
