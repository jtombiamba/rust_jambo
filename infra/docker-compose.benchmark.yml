version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jambo
    ports:
      - "5432:5432"
    volumes:
      - benchmark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 5000
      LOG_LEVEL: info
      RUST_LOG: info
      MAX_RABBITMQ_CONNECTION_RETRIES: 10
      RABBITMQ_PUBLISH_MAX_RETRIES: 3
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: 100
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: 5000
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_COOLDOWN_SECS: 30
      GAME_STALENESS_THRESHOLD_SECS: 60
      DB_POOL_MAX_CONNECTIONS: 100
      DB_POOL_MIN_CONNECTIONS: 5
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 5
      BENCHMARK_MODE: "true"
      BENCHMARK_API_TOKEN: ${BENCHMARK_API_TOKEN:-aiusutzfzdv6529jhz}
      BENCHMARK_BOT_DELAY_MS: "100"
      BENCHMARK_SKIP_CREDIT_CHECK: "true"
      JWT_SECRET: super-secret-key-change-me-in-production-please-do-it-now
      JWT_EXPIRY_HOURS: 24
      IP_HASH_PEPPER: ip-pepper-change-me-1234567890abcdef
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      RATE_LIMIT_DEFAULT_MAX_REQUESTS: "120"
      RATE_LIMIT_DEFAULT_WINDOW_SECONDS: "3600"
      RATE_LIMIT_CONTACT_MAX_REQUESTS: "5"
      RATE_LIMIT_CONTACT_WINDOW_SECONDS: "60"
      RATE_LIMIT_REGISTER_MAX_REQUESTS: "3"
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: "3600"
      RATE_LIMIT_LOGIN_MAX_REQUESTS: "10"
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: "60"
      RATE_LIMIT_FORGOT_PASSWORD_MAX_REQUESTS: "3"
      RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS: "3600"
      RATE_LIMIT_RESET_PASSWORD_MAX_REQUESTS: "10"
      RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS: "60"
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
    ports:
      - "5000:5000"
    volumes:
      - ../backend/migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  ai-worker-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["ai-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      RUST_LOG: ai_worker=info
      MAX_RABBITMQ_CONNECTION_RETRIES: 10
      RABBITMQ_PUBLISH_MAX_RETRIES: 3
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: 100
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: 5000
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_COOLDOWN_SECS: 30
      GAME_STALENESS_THRESHOLD_SECS: 60
      DB_POOL_MAX_CONNECTIONS: 10
      DB_POOL_MIN_CONNECTIONS: 2
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 30
      BOT_THINKING_DELAY_MS: 100
      AI_WORKER_MAX_CONCURRENT: 25
      AI_WORKER_DB_POOL_SIZE: 25
      JWT_SECRET: super-secret-key-change-me-in-production-please-do-it-now
      JWT_EXPIRY_HOURS: 24
      IP_HASH_PEPPER: ip-pepper-change-me-1234567890abcdef
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
    volumes:
      - ../backend/migrations:/app/migrations:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  ai-worker-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["ai-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jambo
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      RUST_LOG: ai_worker=info
      MAX_RABBITMQ_CONNECTION_RETRIES: 10
      RABBITMQ_PUBLISH_MAX_RETRIES: 3
      RABBITMQ_PUBLISH_INITIAL_RETRY_DELAY_MS: 100
      RABBITMQ_PUBLISH_MAX_RETRY_DELAY_MS: 5000
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_COOLDOWN_SECS: 30
      GAME_STALENESS_THRESHOLD_SECS: 60
      DB_POOL_MAX_CONNECTIONS: 10
      DB_POOL_MIN_CONNECTIONS: 2
      DB_POOL_CONNECT_TIMEOUT_SECS: 8
      DB_POOL_ACQUIRE_TIMEOUT_SECS: 8
      DB_POOL_IDLE_TIMEOUT_SECS: 300
      DB_POOL_MAX_LIFETIME_SECS: 1800
      DB_POOL_METRICS_INTERVAL_SECS: 30
      BOT_THINKING_DELAY_MS: 100
      AI_WORKER_MAX_CONCURRENT: 25
      AI_WORKER_DB_POOL_SIZE: 25
      JWT_SECRET: super-secret-key-change-me-in-production-please-do-it-now
      JWT_EXPIRY_HOURS: 24
      IP_HASH_PEPPER: ip-pepper-change-me-1234567890abcdef
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      MAILER_MODE: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM_EMAIL: noreply@fapfap.local
      SMTP_FROM_NAME: "FapFap Game"
    volumes:
      - ../backend/migrations:/app/migrations:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  node_exporter:
    image: prom/node-exporter:v1.12.1
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-benchmark.yml:/etc/prometheus/prometheus.yml:ro
      - benchmark_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1d"
      - "--web.enable-admin-api"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  http-load-test:
    # Uses the image built by infra/scripts/run-load-test.sh, which contains the
    # load-test binaries (the default Dockerfile does NOT build them).
    image: jambo-backend:load-test
    command:
      - "http-load-test"
      - "--target-url=http://backend:5000"
      - "--concurrent-games=50"
      - "--total-games=500"
      - "--warm-up-games=10"
      - "--ramp-up-secs=15"
      - "--duration-secs=120"
      - "--think-time-ms=200"
      - "--client-timeout-ms=2000"
      - "--output=/app/benchmark-results/http-benchmark.json"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      LOG_LEVEL: info
      RUST_LOG: http_load_test=info
      BENCHMARK_API_TOKEN: ${BENCHMARK_API_TOKEN:-aiusutzfzdv6529jhz}
    volumes:
      - ./benchmark-results:/app/benchmark-results
    profiles:
      - benchmark
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  ws-load-test:
    # Uses the image built by infra/scripts/run-load-test.sh, which contains the
    # load-test binaries (the default Dockerfile does NOT build them).
    image: jambo-backend:load-test
    command:
      - "ws-load-test"
      - "--target-url=http://backend:5000"
      - "--concurrent-games=50"
      - "--total-games=100"
      - "--duration-secs=120"
      - "--client-timeout-ms=5000"
      - "--output=/app/benchmark-results/ws-benchmark.json"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RUST_LOG: ws_load_test=info
      BENCHMARK_API_TOKEN: ${BENCHMARK_API_TOKEN:-}
    volumes:
      - ./benchmark-results:/app/benchmark-results
    profiles:
      - benchmark
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  benchmark_postgres_data:
  benchmark_prometheus_data:
