server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Live store holds recent trace data and flushes completed blocks
live_store:
  max_trace_idle: 10s      # Time to wait for spans before flushing
  max_block_duration: 5m   # Max time before cutting head block
  max_block_bytes: 1_000_000 # Max size before cutting head block

# Backend scheduler handles compaction jobs
backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        max_block_bytes: 100_000_000
        block_retention: 1h # Adjust for production retention

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Metrics generator
metrics_generator:
  registry:
    collection_interval: 15s
  processor:
    service_graphs: {} # Enable service graph metrics
    span_metrics:      # Enable RED metrics
      enable_target_info: true
      histogram_buckets: [0.002, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
  storage:
    path: /var/tempo/generator
    remote_write:
      - url: http://prometheus:9090/prometheus/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
