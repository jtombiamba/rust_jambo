worker_processes 2;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name blog;

        root /usr/share/nginx/html;
        index index.html;

        # Healthcheck for orchestrators (k8s readiness probe, Coolify).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # MkDocs static site: rewrite pretty URLs to the generated HTML files.
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Long cache for versioned/immutable build assets (MkDocs names assets
        # under assets/ with content hashes).
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /search/ {
            expires 1d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
    }
}
