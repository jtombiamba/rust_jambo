[workspace]
members = ["crates/*", "migration"]
resolver = "2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2

# Shipped binaries use a single codegen unit for maximum intra-crate
# optimization. `lto` stays thin (from the base profile) across the workspace;
# cargo does not permit per-package `lto` overrides.
[profile.release.package.jambo-server]
codegen-units = 1

[profile.release.package.jambo-ai-worker]
codegen-units = 1

[profile.release.package.jambo-scheduler-worker]
codegen-units = 1

[profile.release.package.jambo-admin-cli]
codegen-units = 1
