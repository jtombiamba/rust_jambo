[package]
name = "jambo-backend"
version = "0.1.0"
edition = "2021"
authors = ["Developer"]
description = "Rust Actix Web backend for the FapFap card game"
license = "MIT"
repository = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Enable this feature to build load-test binaries (not needed for normal dev/CI)
load-tests = []

[dependencies]
actix-web = "4.6"
actix-cors = "0.7"
actix-http = "3"
actix-ws = "0.3"
actix-rt = "2.9"
migration = { path = "migration" }
sea-orm = { version = "2.0.0-rc", features = ["sqlx-postgres", "runtime-tokio-rustls", "schema-sync", "entity-registry", "macros", "with-chrono", "with-uuid", "tracing-spans"] }
lapin = { version = "4.0", features = ["tokio"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
rand = "0.8"
futures = "0.3"
futures-util = "0.3"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenv = "0.15"
config = "0.15"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
argon2 = "0.5"
jsonwebtoken = "9"
cookie = "0.18"
sha2 = "0.10"
hex = "0.4"
prometheus = "0.13"
once_cell = "1"
opentelemetry = { version = "0.32", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
handlebars = "6"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.31"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
http = "1"

[[bin]]
name = "ai-worker"
path = "src/bin/ai_worker.rs"

[[bin]]
name = "scheduler-worker"
path = "src/bin/scheduler_worker.rs"

[[bin]]
name = "load-test"
path = "src/bin/load_test.rs"
required-features = ["load-tests"]

[[bin]]
name = "http-load-test"
path = "src/bin/http_load_test.rs"
required-features = ["load-tests"]

[[bin]]
name = "ws-load-test"
path = "src/bin/ws_load_test.rs"
required-features = ["load-tests"]

[dev-dependencies]
actix-rt = "2.9"
sea-orm = { version = "2.0.0-rc.38", features = ["mock"] }
serial_test = "3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2
