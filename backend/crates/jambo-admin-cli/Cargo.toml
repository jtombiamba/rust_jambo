[package]
name = "jambo-admin-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "admin-cli"
path = "src/main.rs"

[dependencies]
jambo-core = { path = "../jambo-core" }
jambo-db = { path = "../jambo-db" }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "2.0.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.0", features = ["full"] }
csv = "1"
