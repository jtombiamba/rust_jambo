[package]
name = "jambo-types"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "jambo_types"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
utoipa = { version = "5", features = ["uuid", "macros"] }
