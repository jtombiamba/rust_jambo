[package]
name = "jambo-test-helpers"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "jambo_test_helpers"
path = "src/lib.rs"

[dependencies]
jambo-domain = { path = "../jambo-domain" }
jambo-db = { path = "../jambo-db" }
jambo-core = { path = "../jambo-core" }
jambo-mailer = { path = "../jambo-mailer" }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
