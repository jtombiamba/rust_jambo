[package]
name = "jambo-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "jambo-server"
path = "src/main.rs"

[dependencies]
jambo-api = { path = "../jambo-api" }
jambo-core = { path = "../jambo-core" }
jambo-db = { path = "../jambo-db" }
jambo-domain = { path = "../jambo-domain" }
jambo-mailer = { path = "../jambo-mailer" }
actix-web = "4.6"
sea-orm = { version = "2.0.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.0", features = ["full"] }
num_cpus = "1.16"
sysinfo = "0.31"
tracing = { version = "0.1", features = ["log"] }
utoipa = { version = "5", features = ["actix_extras", "uuid", "chrono", "macros"] }
utoipa-swagger-ui = { version = "8", features = ["actix-web"] }
