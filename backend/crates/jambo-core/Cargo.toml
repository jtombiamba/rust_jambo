[package]
name = "jambo-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "jambo_core"
path = "src/lib.rs"

[dependencies]
jambo-types = { path = "../jambo-types" }
jambo-i18n = { path = "../jambo-i18n" }
jambo-metrics = { path = "../jambo-metrics" }
actix-web = "4.6"
actix-cors = "0.7"
sea-orm = "2.0.0"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"
lapin = { version = "4.0", features = ["tokio"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
config = "0.15"
dotenv = "0.15"
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
utoipa = { version = "5", features = ["actix_extras", "macros"] }
